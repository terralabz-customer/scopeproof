[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scopeproof"
version = "0.1.0"
description = "A grounded Strands agent for turning freelance briefs into reviewable scope packs."
requires-python = ">=3.11"
dependencies = ["strands-agents[ollama]==1.55.1", "fastapi==0.141.1", "uvicorn==0.52.4", "httpx==0.28.1", "pydantic==2.13.5"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.7"]

[tool.setuptools.packages.find]
include = ["scopeproof*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
